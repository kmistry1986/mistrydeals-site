<script>
// URL Routing Override: Migrate from hash-based to proper URLs
// This script overrides the default hash-based routing with proper URL routing
(function() {
  // Store the original hash for first load detection
  let initialized = false;

  // Clean up path: remove leading slash and trailing slash
  function normalizePath(path) {
    return path.replace(/^\/+|\/+$/g, '');
  }

  // Get current route from pathname (not hash)
  function readPath() {
    const pathname = (location.pathname || '/').slice(1).split('/').filter(Boolean);
    return {
      screen: pathname[0] || 'home',
      arg: pathname[1] || ''
    };
  }

  // Navigate to a new path using History API
  function navigateTo(screen, arg = '') {
    const path = arg ? `/${screen}/${arg}` : `/${screen}`;
    window.history.pushState(null, '', path);
    // Trigger a custom event that the app can listen to
    window.dispatchEvent(new CustomEvent('sc-navigate', { detail: { screen, arg } }));
  }

  // Handle browser back/forward buttons
  window.addEventListener('popstate', function() {
    const route = readPath();
    window.dispatchEvent(new CustomEvent('sc-navigate', { detail: route }));
  });

  // On first load, convert hash-based URLs to proper URLs (for users with old bookmarks)
  window.addEventListener('load', function() {
    if (!initialized) {
      initialized = true;
      if (location.hash && location.hash.startsWith('#/')) {
        // User has old hash-based URL, convert it
        const hashPath = location.hash.replace(/^#\/?/, '').split('/').filter(Boolean);
        const screen = hashPath[0] || 'home';
        const arg = hashPath[1] || '';
        navigateTo(screen, arg);
      }
    }
  });

  // Expose navigation API globally for the component to use
  window.scNavigation = {
    readPath,
    navigateTo
  };
})();
</script>
