<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="/support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="/_ds/modernist-424462e2-4060-4771-92af-91bbc246b8fd/styles.css">
  <script src="/_ds/modernist-424462e2-4060-4771-92af-91bbc246b8fd/_ds_bundle.js"></script>
</helmet>
<div style="display:flex;flex-direction:column;background:var(--color-surface);border:1px solid var(--color-divider);height:100%;min-width:0" style-hover="border-color:var(--color-accent)">
  <a href="{{ deal.url }}" target="_blank" rel="nofollow sponsored noopener" style="position:relative;aspect-ratio:4/3;background:#ffffff;display:grid;place-items:center;overflow:hidden;text-decoration:none">
    <sc-if value="{{ deal.img }}" hint-placeholder-val="{{ false }}">
      <img src="{{ deal.img }}" alt="{{ deal.title }}" style="position:absolute;inset:0;width:100%;height:100%;object-fit:contain;padding:8px;box-sizing:border-box;display:block" />
    </sc-if>
    <sc-if value="{{ deal.noImg }}" hint-placeholder-val="{{ true }}">
      <span style="font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--color-neutral-500)">{{ deal.cat }}</span>
    </sc-if>
    <sc-if value="{{ deal.hasOff }}" hint-placeholder-val="{{ true }}">
      <div style="position:absolute;top:0;left:0;background:var(--color-accent);color:#16233a;font-family:var(--font-heading);font-weight:800;font-size:14px;line-height:1;padding:5px 7px 6px">{{ deal.off }}</div>
    </sc-if>
    <sc-if value="{{ deal.atLowest }}" hint-placeholder-val="{{ false }}">
      <div style="position:absolute;top:0;right:0;background:var(--color-neutral-900);color:var(--color-bg);font-family:var(--font-heading);font-weight:700;font-size:8px;letter-spacing:.09em;text-transform:uppercase;padding:4px 6px">Lowest ever</div>
    </sc-if>
  </a>
  <div style="display:grid;grid-template-rows:12px 48px auto 14px auto;gap:6px;padding:9px 10px 10px;flex:1">
    <div style="font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--color-neutral-600);overflow:hidden;white-space:nowrap;text-overflow:ellipsis">{{ deal.cat }}</div>
    <a href="{{ deal.url }}" target="_blank" rel="nofollow sponsored noopener" style="font-family:var(--font-heading);font-weight:800;font-size:13px;line-height:1.22;letter-spacing:-.01em;overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;color:var(--color-text);text-decoration:none" style-hover="color:var(--color-accent-700)">{{ deal.title }}</a>
    <div style="display:flex;align-items:baseline;gap:6px;min-width:0;flex-wrap:wrap">
      <span style="font-family:var(--font-heading);font-weight:800;font-size:22px;line-height:1;letter-spacing:-.02em">{{ deal.price }}</span>
      <sc-if value="{{ deal.hasOff }}" hint-placeholder-val="{{ true }}">
        <span style="font-size:11px;text-decoration:line-through;color:var(--color-neutral-600)">{{ deal.was }}</span>
      </sc-if>
    </div>
    <div style="font-size:10px;color:var(--color-neutral-700);white-space:nowrap;overflow:hidden">★ {{ deal.rating }} {{ deal.reviews }}</div>
    <div style="display:grid;grid-template-columns:1fr;gap:6px">
      <a href="{{ deal.url }}" target="_blank" rel="nofollow sponsored noopener" class="btn btn-primary" style="justify-content:space-between;white-space:nowrap;font-size:10px;padding:7px 8px;gap:4px;min-width:0;overflow:hidden">Amazon <span>&#8594;</span></a>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:230,&quot;height&quot;:300},&quot;deal&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;{title:string,cat:string,price:string,was:string,off:string,rating:string,reviews:string,img?:string,noImg?:boolean,url:string}&quot;}}"></script>
</body>
</html>
