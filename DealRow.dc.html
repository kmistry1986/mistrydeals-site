<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="/support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="/_ds/modernist-424462e2-4060-4771-92af-91bbc246b8fd/styles.css">
  <script src="/_ds/modernist-424462e2-4060-4771-92af-91bbc246b8fd/_ds_bundle.js"></script>
</helmet>
<div style="display:grid;grid-template-columns:104px 1fr 120px 170px 176px;gap:20px;align-items:center;padding:14px 0;border-bottom:1px solid var(--color-divider);background:transparent" style-hover="background:color-mix(in srgb, var(--color-accent) 12%, transparent)">
  <div style="position:relative;height:78px;background:#ffffff;display:grid;place-items:center;overflow:hidden">
    <sc-if value="{{ deal.img }}" hint-placeholder-val="{{ false }}">
      <img src="{{ deal.img }}" alt="{{ deal.title }}" style="position:absolute;inset:0;width:100%;height:100%;object-fit:contain;padding:6px;box-sizing:border-box;display:block" />
    </sc-if>
    <sc-if value="{{ deal.noImg }}" hint-placeholder-val="{{ true }}">
      <span style="font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--color-neutral-500)">Photo</span>
    </sc-if>
    <div style="position:absolute;top:0;left:0;background:var(--color-accent);color:#f3f2f2;font-family:var(--font-heading);font-weight:800;font-size:13px;line-height:1;padding:5px 6px">{{ deal.off }}</div>
  </div>
  <div style="display:flex;flex-direction:column;gap:4px;min-width:0">
    <div style="font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--color-neutral-600)">{{ deal.cat }}</div>
    <div style="font-family:var(--font-heading);font-weight:800;font-size:17px;line-height:1.2;letter-spacing:-.01em;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical">{{ deal.title }}</div>
    <div style="display:flex;align-items:center;gap:10px;font-size:11px;color:var(--color-neutral-700)">
      <span>★ {{ deal.rating }} {{ deal.reviews }}</span>
      <span>{{ deal.updated }}</span>
    </div>
  </div>
  <div style="display:flex;align-items:center;min-height:26px">
    <sc-if value="{{ deal.code }}" hint-placeholder-val="{{ false }}">
      <div style="font-size:10px;font-family:var(--font-heading);font-weight:600;letter-spacing:.06em;border:1px dashed var(--color-accent);color:var(--color-accent-700);padding:4px 6px;white-space:nowrap">CODE {{ deal.code }}</div>
    </sc-if>
  </div>
  <div style="display:flex;flex-direction:column;align-items:flex-start;gap:2px">
    <span style="font-family:var(--font-heading);font-weight:800;font-size:30px;line-height:1;letter-spacing:-.02em">{{ deal.price }}</span>
    <span style="font-size:12px;text-decoration:line-through;color:var(--color-neutral-600)">was {{ deal.was }}</span>
    <sc-if value="{{ deal.code }}" hint-placeholder-val="{{ false }}">
      <span style="font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--color-accent-700);white-space:nowrap">with code</span>
    </sc-if>
  </div>
  <a href="{{ deal.url }}" target="_blank" rel="nofollow sponsored noopener" class="btn btn-primary" style="justify-content:space-between;width:100%">View on Amazon <span>&#8594;</span></a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:900,&quot;height&quot;:108},&quot;deal&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;object&quot;}}"></script>
</body>
</html>
